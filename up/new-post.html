<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin</title>
    <!-- <link rel="stylesheet" href="up/css/admin-style.css" /> -->
        <link rel="stylesheet" href="/up/css/admin-style.css">
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>

  <body class="container">
    <nav class="admin-nav padd">
      <a href="admin.html">
        <img
          src="/up/images/sjsToraiLogo1.png"
          alt="logo"
          class="admin-nav__logo"
        />
      </a>

      <ul class="admin-nav__links">
        <li class="admin-nav__links-link">
          <a href="admin.html">
            <i class="fa-solid fa-house"></i>
            Dashboard
          </a>
        </li>
        <li class="admin-nav__links-link">
          <a href="blogs-listing.html"
            ><i class="fa-solid fa-blog"></i>
            <span>News</span>
          </a>
        </li>
        <li class="admin-nav__links-link">
          <a href="admin.html"
            ><i class="fa-solid fa-image"></i>
            <span>Gallery</span>
          </a>
        </li>
        <li class="admin-nav__links-link">
          <a href="admin-contact.html"
            ><i class="fa-solid fa-address-card"></i>
            <span>Contacts</span>
          </a>
        </li>
      </ul>

      <ul class="admin-nav__links admin-nav__logout">
        <li class="admin-nav__links-link">
          <a href="admin.html"
            ><i class="fa-solid fa-right-from-bracket"></i>
            <span>Logout</span>
          </a>
        </li>
      </ul>
    </nav>

    <section class="admin-nav__phone padd">
      <a href="#" class="admin-nav__phone-logo">
        <img src="/up/images/sjsToraiLogo1.png" alt="" class="logo" />
      </a>

      <ul class="admin-nav__phone-links">
        <li class="admin-nav__phone-link">
          <a href="admin.html"><i class="fa-solid fa-house"></i></a>
        </li>
        <li class="admin-nav__phone-link">
          <a href="blogs-listing.html"><i class="fa-solid fa-blog"></i></a>
        </li>
        <li class="admin-nav__phone-link">
          <a href="#"><i class="fa-solid fa-image"></i></a>
        </li>
        <li class="admin-nav__phone-link">
          <a href="#"><i class="fa-solid fa-address-card"></i></a>
        </li>
        <li class="admin-nav__phone-link">
          <a href="admin-contact.html"
            ><i class="fa-solid fa-right-from-bracket"></i
          ></a>
        </li>
      </ul>
    </section>

    <header class="header padd">
      <div class="header__greeting">
        <h3 class="sec-sub-title">Good morning</h3>
        <h2 class="sec-title">Principal</h2>
      </div>

      <div class="header__icons">
        <i class="fa-solid fa-magnifying-glass"></i>
        <i class="fa-solid fa-bell"></i>
        <i class="fa-solid fa-envelope"></i>

        <figure class="header__icons-profile">
          <img src="./up/images/userProPic.png" alt="" />
        </figure>
      </div>
    </header>

    <form class="add-blog padd">
      <h2 class="sec-title">Add Blog</h2>
      <fieldset class="add-blog__title">
        <label class="sec-sub-title">Blog Title</label>
        <input type="text" placeholder="Enter blog title" />
      </fieldset>

      <fieldset class="add-blog__comments">
        <p>
          <input type="checkbox" name="" id="" />
          <label class="sec-sub-title">Blog description</label>
        </p>
        <textarea placeholder="Type something"></textarea>
      </fieldset>

      <div class="add-blog__create">
        <fieldset class="add-blog__create-btn">
          <label class="sec-sub-title">Add Imeges</label>
          <input type="file">
        </fieldset>

        <fieldset class="add-blog__create-btn">
          <input type="button" value=" CANCEL" class="cancel" />
          <input type="button" value="PUBLISH" class="save" />
        </fieldset>
      </div>
    </form>
  </body>
</html>
