<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin - Dashboard</title>
    <!-- Quilleditor -->
     <link href="https://cdn.quilljs.com/1.3.7/quill.snow.css" rel="stylesheet">



    <link rel="stylesheet" href="up/css/admin-style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

  </head>
  <body class="container">

    <!-- Left Sidebar Navigation -->
    <nav class="admin-nav padd">
      <a href="admin-dashboard.html" class="admin-nav__logo">
        <img src="/up/images/sjsToraiLogo1.png" alt="Logo" class="logo" />
      </a>

      <ul class="admin-nav__links">
        <li>
          <a href="admin-dashboard.html" class="admin-nav__link admin-nav__link--active">
            <i class="fa-solid fa-house-chimney"></i>
            <span>Dashboard</span>
          </a>
        </li>
        <li>
          <a href="admin-blogs.html" class="admin-nav__link">
            <i class="fa-solid fa-blog"></i>
            <span>Blogs</span>
          </a>
        </li>
        <li>
          <a href="admin-contacts.html" class="admin-nav__link">
            <i class="fa-solid fa-address-book"></i>
            <span>Contacts</span>
          </a>
        </li>
      </ul>
    </nav>

    <!-- Main Content Area -->
    <main class="admin-main page-width padd">
      
      <!-- Header with greeting and icons -->
      <header class="admin-header padd">
        <div class="admin-header__greeting">
          <h2 class="admin-header__mini-title sec-title">Good Morning</h2>
          <h1 class="admin-header__title sec-title">Fr. Charls</h1>
          
        </div>

        <div class="admin-header__icons">
      <div class="admin-header__search">
      <button type="button"
              class="admin-header__icon-btn"
              id="searchToggle"
              aria-label="Search"
              aria-expanded="false">
        <i class="fa-solid fa-magnifying-glass"></i>
      </button>

      <!-- Hidden search form -->
      <form class="admin-header__search-form" id="searchForm" action="/search" method="get">
        <input type="search"
               name="q"
               placeholder="Search…"
               aria-label="Search site" />
      </form>
    </div>
          <button class="admin-header__icon-btn" aria-label="Notifications">
            <i class="fa-solid fa-bell"></i>
          </button>
          <button class="admin-header__icon-btn" aria-label="Messages">
            <i class="fa-solid fa-envelope"></i>
          </button>
          <figure class="admin-header__profile">
            <img src="/up/images/johnhemb.jpg" alt="John Doe profile" />
          </figure>
        </div>
      </header>


      <!-- Blog Add Form Section -->
  <section class="admin-blog padd">
    <h2 class="admin-blog__title sec-sub-title">Create Blog Post</h2>

    <form class="blog-form">

      <!-- Blog Title -->
      <div class="form-group">
        <label for="title">Title</label>
        <input id="title" name="title" type="text" placeholder="Enter blog title" required />
      </div>

      <!-- Slug -->
      <div class="form-group">
        <label for="slug">Slug</label>
        <input id="slug" name="slug" type="text" placeholder="auto-generated or custom-slug" />
      </div>

      <!-- Category -->
      <div class="form-group">
        <label for="category">Category</label>
        <select id="category" name="category">
          <option value="">Select category</option>
          <option value="tech">Tech</option>
          <option value="news">News</option>
          <option value="lifestyle">Lifestyle</option>
        </select>
      </div>

      <!-- Description -->
      <div class="form-group form-group--description">
        <label for="description">Short Description</label>
        <textarea id="description" name="description"></textarea>
      </div>


<!-- Blog Body -->
<div class="form-group admin-blog-editor">
  <label for="editor-container">Body</label>

  <!-- Quill Editor -->
  <div id="editor-container"></div>

  <!-- Hidden field for backend -->
  <input type="hidden" name="body" id="hidden-body" />

  <!-- Preview Toggle -->
  <button type="button" class="preview-toggle-btn" id="preview-button">
    Preview Content
  </button>

  <!-- Collapsible Preview Box -->
  <div id="editor-preview" class="editor-preview"></div>
</div>




      <!-- Image Upload -->
      <div class="form-group">
        <label for="image">Upload Image</label>
        <input id="image" name="image" type="file" />
      </div>

            <!-- Featured -->
      <div class="form-group form-check">
        <label for="featured">
          <input type="checkbox" id="featured" name="featured" />
          Mark as Featured
        </label>
      </div>

      <!-- Status -->
      <div class="form-group">
        <label for="status">Status</label>
        <select id="status" name="status">
          <option value="draft">Draft</option>
          <option value="publish">Publish</option>
        </select>
      </div>

      <!-- Submit -->
      <div class="form-actions">
        <button type="submit" class="btn-primary">Publish</button>
        <button type="reset" class="btn-secondary">Clear</button>
      </div>
    </form>
  </section>

    </main>
    <!-- Include the Quill library -->
<script src="https://cdn.quilljs.com/1.3.7/quill.js"></script>
<!-- imageResize MOdule -->
<script src="https://cdn.jsdelivr.net/npm/quill-image-resize-module@3.0.0/image-resize.min.js"></script>
    <!-- <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"> DidntWrok</script> -->
    <script src="up/js/admin.js"></script>
  </body>
</html>
