<!DOCTYPE html>
<html lang="en">
  <head>

    <link

      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body class="container">
    <nav class="admin-nav padd">
      <a href="admin.html">
        <img src="/up/images/sjsToraiLogo1.png" alt="logo" class="admin-nav__logo" />
      </a>

      <ul class="admin-nav__links">
        <li class="admin-nav__links-link">
          <a href="admin.html">
            <i class="fa-solid fa-house"></i>
            Dashboard
          </a>
        </li>
        <li class="admin-nav__links-link">
          <a href="blogs-listing.html"
            ><i class="fa-solid fa-blog"></i>
            <span>News</span>
          </a>
        </li>
        <li class="admin-nav__links-link">
          <a href="admin.html"
            ><i class="fa-solid fa-image"></i>
            <span>Gallery</span>
          </a>
        </li>
        <li class="admin-nav__links-link">
          <a href="admin-contact.html"
            ><i class="fa-solid fa-address-card"></i>
            <span>Contacts</span>
          </a>
        </li>
      </ul>

      <ul class="admin-nav__links admin-nav__logout">
        <li class="admin-nav__links-link">
          <a href="admin.html"
            ><i class="fa-solid fa-right-from-bracket"></i>
            <span>Logout</span>
          </a>
        </li>
      </ul>
    </nav>
    
      <section class="admin-nav__phone padd">
      <a href="#" class="admin-nav__phone-logo">
        <img src="/up/images/sjsToraiLogo1.png" alt="" class="logo" />
      </a>

      <ul class="admin-nav__phone-links">
        <li class="admin-nav__phone-link">
          <a href="admin.html"><i class="fa-solid fa-house"></i></a>
        </li>
        <li class="admin-nav__phone-link">
          <a href="blogs-listing.html"><i class="fa-solid fa-blog"></i></a>
        </li>
        <li class="admin-nav__phone-link">
          <a href="#"><i class="fa-solid fa-image"></i></a>
        </li>
        <li class="admin-nav__phone-link">
          <a href="#"><i class="fa-solid fa-address-card"></i></a>
        </li>
        <li class="admin-nav__phone-link">
          <a href="admin-contact.html"><i class="fa-solid fa-right-from-bracket"></i></a>
        </li>
      </ul>
    </section>

    <header class="header padd">
      <div class="header__greeting">
        <h3 class="sec-sub-title">Good morning</h3>
        <h2 class="sec-title">Principal</h2>
      </div>

      <div class="header__icons">
        <i class="fa-solid fa-magnifying-glass"></i>
        <i class="fa-solid fa-bell"></i>
        <i class="fa-solid fa-envelope"></i>

        <figure class="header__icons-profile">
          <img src="./up/images/userProPic.png" alt="" />
        </figure>
      </div>
    </header>

<main class="post-page layout-grid padd">
  <nav class="breadcrumb">
    <p class="breadcrumb__item">Post</p>
    <span class="breadcrumb__separator">></span>
    <p class="breadcrumb__item">List</p>
  </nav>

  <header class="post-header">
    <h2 class="post-header__title">Posts</h2>
    <a class="post-header__link" href="new-post.html">New Post</a>
  </header>

  <section class="post-search">
    <fieldset class="post-search__field">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="text" placeholder="search" />
    </fieldset>
    <div class="post-search__filters">
      <i class="fa-solid fa-filter"></i>
      <i class="fa-solid fa-layer-group"></i>
    </div>
  </section>

  <section class="post-table">
    <div class="post-table__grid">
      <div class="post-table__row post-table__row--header">
        <h3 class="post-table__cell">Image</h3>
        <h3 class="post-table__cell">Title</h3>
        <h3 class="post-table__cell">Author</h3>
        <h3 class="post-table__cell">Status</h3>
        <h3 class="post-table__cell">Date</h3>
        <h3 class="post-table__cell">Edit</h3>
        <h3 class="post-table__cell">Delete</h3>
      </div>

      <div class="post-table__row post-table__row--child">
        <div class="post-table__cell"><img src="https://picsum.photos/200" alt="news" class="post-table__image" /></div>
        <div class="post-table__cell">Gopikandar me mela</div>
        <div class="post-table__cell">Pankaj kumar</div>
        <div class="post-table__cell">Draft</div>
        <div class="post-table__cell">2-10-2025</div>
        <a href="#" class="post-table__edit"><i class="fa-solid fa-pen-to-square"></i> Edit</a>
        <a href="#" class="post-table__delete"><i class="fa-solid fa-trash"></i> Delete</a>
      </div>

      <!-- Repeat .post-table__row for each post -->
    </div>
  </section>
</main>


  </body>
</html>
